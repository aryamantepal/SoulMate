name: keep-warm

# Pings the Render backend so the free-tier instance never spins down
# (no cold-start 30-50s delay on the next real visitor).

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://soulmate-9grg.onrender.com/api/health
